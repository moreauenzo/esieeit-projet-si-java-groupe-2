plugins {
    // Application Java exécutable en ligne de commande (./gradlew run)
    id 'application'
}

group = 'com.esiee'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Tests unitaires : JUnit 5 (Jupiter)
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.esiee.project.App'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
